name: Daily Contribution

on:
  schedule:
    # 매일 KST 09:00 (UTC 00:00) 실행
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  contribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update contribution log
        run: |
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') — automated security audit log" >> contributions.log

      - name: Commit and push
        run: |
          git config user.name "junguk03"
          git config user.email "junkuk9503@gmail.com"
          git add contributions.log
          git diff --cached --quiet || git commit -m "chore: daily contribution $(date -u '+%Y-%m-%d')"
          git push
